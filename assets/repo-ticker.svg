              fill="#586069">hangsman</text>
        <text x="258" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500"
              fill="#6a737d">| 790 ★</text>
