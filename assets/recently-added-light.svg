    <text x="64" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328">Gryph is a security layer for AI coding agents. It hooks into Claude Code</text>
